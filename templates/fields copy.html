<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>Диспетчер Полів</title>
    <style>
        :root { 
            --bg-main: #0a0a0a; 
            --bg-card: #141414; 
            --text: #ffffff; 
            --accent: #00ff7f; 
        }
        body { 
            background-color: var(--bg-main); 
            color: var(--text); 
            font-family: sans-serif; 
            margin: 0; 
            padding: 20px 40px 120px 40px; 
            user-select: none; 
        }
        h1 { color: var(--accent); border-bottom: 2px solid #222; padding-bottom: 10px; }
        .table-container { background: var(--bg-card); border-radius: 15px; padding: 10px; border: 1px solid #222; max-height: 60vh; overflow-y: auto; }
        table { width: 100%; border-collapse: collapse; text-align: left; }
        th { padding: 15px 10px; border-bottom: 2px solid #333; color: #aaa; font-size: 1.1rem; }
        td { padding: 15px 10px; border-bottom: 1px solid #222; font-size: 1.2rem; }
        .btn { border: none; padding: 12px 24px; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; }
        .btn-open { background: var(--accent); color: #000; margin-right: 10px; }
        .btn-delete { background: #ff4444; color: #fff; }
        
        /* Нижня панель */
        .bottom-bar { position: fixed; bottom: 0; left: 0; width: 100%; padding: 20px 40px; box-sizing: border-box; display: flex; justify-content: space-between; z-index: 999; }
        .btn-nav { width: 45%; height: 80px; border-radius: 15px; font-size: 1.4rem; font-weight: bold; cursor: pointer; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }

        /* Стилі Кастомного Модального Вікна askUser */
        .modal {
            display: none;
            position: fixed;
            z-index: 10000;
            left: 0; top: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.8);
            align-items: center; justify-content: center;
        }
        .modal-content {
            background-color: var(--bg-card);
            border: 2px solid #333;
            padding: 30px;
            border-radius: 20px;
            width: 80%; max-width: 500px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .modal-text { font-size: 1.4rem; margin-bottom: 30px; line-height: 1.6; }
        .modal-buttons { display: flex; gap: 20px; justify-content: center; }
        .modal-btn { flex: 1; padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; border: none; cursor: pointer; }
    </style>
</head>
<body>

    <h1>💾 Менеджер збережених полів</h1>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Назва поля / треку</th>
                    <th>Дата збереження</th>
                    <th>Розмір</th>
                    <th style="text-align: right; padding-right: 20px;">Дії</th>
                </tr>
            </thead>
            <tbody id="files-tbody">
                <!-- Рядки генеруються через JS -->
            </tbody>
        </table>
    </div>

    <!-- Нижня панель навігації -->
    <div class="bottom-bar">
        <button class="btn-nav" style="background: #2c2c2c; color: #fff; border: 2px solid #444;" onclick="window.location.href='/'">НАЗАД ДО НАВІГАЦІЇ</button>
        <button class="btn-nav" style="background: var(--accent); color: #000; border: none;" onclick="saveCurrentField()">ЗБЕРЕГТИ ПОТОЧНЕ ПОЛЕ</button>
    </div>

    <!-- Кастомне модальне вікно (наша TFormModal) -->
    <div id="customModal" class="modal">
        <div class="modal-content" id="modalContent">
            <div id="modalText" class="modal-text">Текст повідомлення</div>
            <div class="modal-buttons">
                <button id="modalCancelBtn" class="modal-btn" style="background: #333; color: #fff;" onclick="closeModal()">СКАСУВАТИ</button>
                <button id="modalConfirmBtn" class="modal-btn">ОК</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", loadFileList);

        // Фірмова функція askUser (як у налаштуваннях)
        function askUser(text, theme, confirmText, onConfirm) {
            const modal = document.getElementById('customModal');
            const modalText = document.getElementById('modalText');
            const confirmBtn = document.getElementById('modalConfirmBtn');
            const cancelBtn = document.getElementById('modalCancelBtn');

            modalText.innerHTML = text;
            confirmBtn.innerText = confirmText;

            // Налаштування теми вікна
            if (theme === 'danger') {
                confirmBtn.style.background = '#ff4444';
                confirmBtn.style.color = '#fff';
                cancelBtn.style.display = 'block'; // Показуємо кнопку скасування
            } else if (theme === 'success') {
                confirmBtn.style.background = 'var(--accent)';
                confirmBtn.style.color = '#000';
                cancelBtn.style.display = 'block';
            } else {
                // Тема 'info' або просто повідомлення (аналог ShowMessage / Alert)
                confirmBtn.style.background = '#3498db';
                confirmBtn.style.color = '#fff';
                cancelBtn.style.display = 'none'; // Ховаємо скасування, залишається тільки ОК
            }

            // Очищення та прив'язка колбеку
            confirmBtn.onclick = null;
            confirmBtn.onclick = () => {
                modal.style.display = 'none';
                if (onConfirm) onConfirm();
            };

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('customModal').style.display = 'none';
        }

        function loadFileList() {
            fetch('/api/files')
                .then(res => res.json())
                .then(files => {
                    const tbody = document.getElementById('files-tbody');
                    tbody.innerHTML = '';
                    
                    if (files.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding:40px; color:#555;">Список порожній. Немає збережених треків.</td></tr>';
                        return;
                    }

                    files.forEach(file => {
                        const tr = document.createElement('tr');
                        // Кодуємо ім'я для безпечної передачі у функцію кліку
                        const safeName = encodeURIComponent(file.name);
                        
                        tr.innerHTML = `
                            <td style="font-weight:bold; color:var(--accent);">${file.name.replace('.json', '')}</td>
                            <td style="color:#aaa;">${file.date}</td>
                            <td style="color:#aaa;">${file.size} КБ</td>
                            <td style="text-align: right; padding-right: 10px;">
                                <button class="btn btn-open" onclick="loadField('${safeName}')">ОТКРЫТЬ</button>
                                <button class="btn btn-delete" onclick="deleteField('${safeName}')">Х</button>
                            </td>
                        `;
                        tbody.appendChild(tr);
                    });
                });
        }

        function loadField(encodedFilename) {
            const filename = decodeURIComponent(encodedFilename);
            const cleanName = filename.replace('.json', '');
            
            askUser(
                `Завантажити поле<br><b>"${cleanName}"</b><br>в систему водіння?`, 
                'success', 
                'ВІДКРИТИ', 
                () => {
                    fetch('/api/load_field', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: filename })
                    }).then(res => {
                        if (res.ok) {
                            askUser(`Поле "${cleanName}" успішно завантажено!`, 'info', 'ОК', () => {
                                window.location.href = '/';
                            });
                        } else {
                            askUser('Помилка завантаження файлу.', 'danger', 'ОК');
                        }
                    });
                }
            );
        }

        function deleteField(encodedFilename) {
            const filename = decodeURIComponent(encodedFilename);
            const cleanName = filename.replace('.json', '');
            
            askUser(
                `УВАГА!<br>Видалити файл <b>"${cleanName}"</b><br>безповоротно з диска SBC?`, 
                'danger', 
                'ВИДАЛИТИ', 
                () => {
                    fetch('/api/delete_field', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ filename: filename })
                    }).then(res => {
                        if (res.ok) loadFileList();
                    });
                }
            );
        }

        function saveCurrentField() {
            const fieldName = prompt("Введіть назву для поточного поля (пробелы дозволені):");
            if (!fieldName || fieldName.trim() === "") return;

            fetch('/api/save_field', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ field_name: fieldName })
            })
            .then(res => res.json())
            .then(data => {
                if (data.status === "success") {
                    askUser(`Поточну сесію фіксовано під ім'ям:<br><b>"${fieldName}"</b>`, 'info', 'ЧУДОВО', () => {
                        loadFileList();
                    });
                } else {
                    askUser("Помилка збереження:<br>" + data.error, 'danger', 'ОК');
                }
            });
        }
    </script>
</body>
</html>
