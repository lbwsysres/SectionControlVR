<!DOCTYPE html>
<html>

<head>
    <title>MySection Pro Terminal</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/diagnostic.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/emulator.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/board.css') }}">
</head>

<body>
    <!-- НИЗ: Управление секциями -->
    <div class="bottom-controls">
        <div id="lb_gps_mode_text"> . . . </div>
        <div id="sections-container">
            <div id="manual_ctrl" class="mode-grid"></div>
        </div>
    </div>

    <!-- Панель паралельного водіння (Навігатор) -->
    <div class="guidance-container single-line">
        <div
            style="position: relative; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center;">
            <svg id="compass" width="32" height="32" viewBox="0 0 100 100"
                style="position: absolute;top: 50%;left: 50%;transform: translate(-50%, -50%);width: 52px; height: 52px;z-index: 100;">
                <circle cx="50" cy="50" r="42" fill="rgba(0,0,0,0.5)" stroke="#444" stroke-width="3" />
                <text x="50" y="25" fill="white" font-size="14" font-weight="bold" text-anchor="middle">N</text>
                <path d="M50 32 L62 75 L50 67 L38 75 Z" fill="#e74c3c" id="needle" />
            </svg>
        </div>
        <div class="lightbar-section">
            <div id="lb_text">SET A-B LINE</div>
            <div id="id_lightbar" class="lightbar">
                <div class="lb-center"></div>
                <div id="lb_pointer"></div>
            </div>
        </div>
        <!-- Кнопка виклику меню -->
        <button class="tool-btn" onclick="abToggleMenu()">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#f1c40f" stroke-width="2">
                <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
            </svg>
        </button>
        <!-- ГОЛОВНИЙ КОНТЕЙНЕР МЕНЮ -->
        <div id="ab-quick-menu" class="ab-menu-container" style="display:none;">

            <!-- Гілка 1: Основні кнопки (ID тепер тут) -->
            <div id="ab-main-grid" class="ab-menu-grid"
                style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                <button id="btn_set_a" class="ab-btn-item" onclick="setPoint('a')">A</button>
                <button id="btn_set_b" class="ab-btn-item" onclick="setPoint('b')">B</button>
                <button class="ab-btn-item ab-btn-danger" onclick="abResetHandler()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
                <button class="ab-btn-item ab-btn-warning" onclick="toggleAbEdit()">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2.5">
                        <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                        <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                    </svg>
                </button>
            </div>
            <!-- Гілка 2: Панель ручного зсуву -->
            <div id="ab-edit-panel" style="display:none; flex-direction: column; gap: 12px;">
                <div style="display: flex; gap: 8px; align-items: center; width: 100%;">
                    <button class="ab-btn-item"
                        style="flex: 1; height: 65px; background: #34495e; font-size: 18px; min-width: 65px;"
                        onclick="nudgeAB(-0.05)">-5</button>
                    <input type="number" id="ab_off_val" placeholder="0.00"
                        style="flex: 1.5; height: 65px; background: #111; color: #2ecc71; border: 1px solid #444; border-radius: 12px; text-align: center; font-size: 20px; min-width: 0;">
                    <button class="ab-btn-item"
                        style="flex: 1; height: 65px; background: #34495e; font-size: 18px; min-width: 65px;"
                        onclick="nudgeAB(0.05)">+5</button>
                </div>
                <div style="display: flex; gap: 10px;">
                    <button class="ab-btn-item"
                        style="flex: 1; height: 75px; background: #2ecc71; color: #000; font-size: 22px;"
                        onclick="saveAbManual()">OK</button>
                    <button class="ab-btn-item" style="width: 75px; height: 75px; background: #444;"
                        onclick="toggleAbEdit()">↩</button>
                </div>
                <!-- РАЗДЕЛИТЕЛЬ -->
                <hr style="border: 0; border-top: 1px solid #444; margin: 5px 0;">
                <div style="display: flex; gap: 5px; margin-bottom: 10px; width: 100%;">
                    <button type="button" class="ab-tab-btn active" id="tab-T" onclick="switchAbTab('T')">T</button>
                    <button type="button" class="ab-tab-btn" id="tab-A" onclick="switchAbTab('A')">A</button>
                    <button type="button" class="ab-tab-btn" id="tab-B" onclick="switchAbTab('B')">B</button>
                </div>
                <!-- БЛОК КООРДИНАТ: ОДНА ПОД ДРУГОЙ -->
                <div style="display: flex; flex-direction: column; gap: 10px; width: 100%;">

                    <!-- Поля ввода на всю ширину -->
                    <input type="number" id="manual_lat" placeholder="Широта (Lat)"
                        style="width: 100%; height: 45px; background: #111; color: #3498db; border: 1px solid #444; border-radius: 10px; text-align: center; font-size: 20px; box-sizing: border-box;">

                    <input type="number" id="manual_lon" placeholder="Долгота (Lon)"
                        style="width: 100%; height: 45px; background: #111; color: #3498db; border: 1px solid #444; border-radius: 10px; text-align: center; font-size: 20px; box-sizing: border-box;">
                    <div style="display: flex; gap: 10px; width: 100%; margin-top: 10px;">
                        <!-- Кнопка ЗАПИСАТЬ А -->
                        <button class="ab-btn-item"
                            style="flex: 1; height: 65px; background: #3498db; color: white; border: none; border-radius: 15px;"
                            onclick="recordManualCoords('a')">
                            <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
                                <!-- Иконка дискеты -->
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                    <polyline points="7 3 7 8 15 8"></polyline>
                                </svg>
                                <span style="font-size: 24px; font-weight: bold;">A</span>
                            </div>
                        </button>
                        <!-- Кнопка ЗАПИСАТЬ В -->
                        <button class="ab-btn-item"
                            style="flex: 1; height: 65px; background: #3498db; color: white; border: none; border-radius: 15px;"
                            onclick="recordManualCoords('b')">
                            <div style="display: flex; align-items: center; justify-content: center; gap: 12px;">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                    stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                    <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
                                    <polyline points="17 21 17 13 7 13 7 21"></polyline>
                                    <polyline points="7 3 7 8 15 8"></polyline>
                                </svg>
                                <span style="font-size: 24px; font-weight: bold;">B</span>
                            </div>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/emulator.css') }}">

    <div id="emulator" class="emu-panel">
        <div class="emu-joy-container">
            <div id="joy_zone" class="emu-joy-zone">
                <div class="emu-axis-v"></div>
                <div class="emu-axis-h"></div>
                <div id="joy_stick" class="emu-joy-stick"></div>
            </div>
        </div>
    </div>
    <!--script src="{{ url_for('static', filename='js/emulator.js') }}"></script-->

    <!-- ***************************************************************************************** -->
    <!-- ВЕРХНИЙ ЛЕВЫЙ УГОЛ: Инфо-панель -->
    <div class="top-left-panel">
        <div class="panel-main-row">

        </div>
        <div class="diag-panel">
            <!-- КОЛОНКА 1: GPS -->
            <div class="diag-col">
                <div id="gps_icon_container" class="diag-icon-box">
                    <svg id="svg_gps" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e74c3c"
                        stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"
                        style="transition: stroke 0.2s;">
                        <g transform="rotate(-45 12 12)">
                            <circle cx="12" cy="10" r="3"></circle>
                            <path d="M4 6h4v8H4zM16 6h4v8h-4z"></path>
                            <path d="M7 17a3 2 0 0 0 9 0"></path>
                            <path d="M8 22a3 2 0 0 0 6 0"></path>
                    </svg>
                    <div id="gps_slash" class="diag-slash"></div>
                </div>
                <div class="diag-text-box">
                    <span id="txt_gps_status" class="diag-status">NO FIX</span>
                    <span id="txt_gps_sats" class="diag-sub">Спутники: 0</span>
                    <span id="txt_gps_speed" class="diag-sub">0.0 km/h</span>
                    <div class="diag-dop-container"
                        style="display: none; font-size: 11px; color: #7f8c8d; margin-top: 1px; font-family: monospace; white-space: nowrap;">
                        H:<span id="txt_gps_hdop" style="color: #bdc3c7; font-weight: bold;">0.0</span>
                        V:<span id="txt_gps_vdop" style="color: #bdc3c7; font-weight: bold;">0.0</span>
                        P:<span id="txt_gps_pdop" style="color: #bdc3c7; font-weight: bold;">0.0</span>
                    </div>
                </div>
            </div>

            <div class="diag-divider"></div>

            <!-- КОЛОНКА 2: BOARD -->
            <div class="diag-col">
                <div id="board_icon_container" class="diag-icon-box">
                    <svg id="svg_board" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e74c3c"
                        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"
                        style="transition: stroke 0.2s;">
                        <rect x="2" y="4" width="20" height="16" rx="2" />
                        <path d="M6 8h2v2H6zM6 14h2v2H6zM11 11h7v2h-7z" />
                    </svg>
                    <div id="board_slash" class="diag-slash"></div>
                </div>
                <div class="diag-text-box">
                    <span id="txt_board_status" class="diag-status">OFFLINE</span>
                    <span id="txt_esp_current_flow" class="diag-sub">Параметр: —</span>
                    <span id="txt_esp_pressure" class="diag-sub">Параметр: —</span>
                    <span id="txt_esp_pwm" class="diag-sub">Параметр: —</span>
                    <span id="board_template_1" class="diag-sub">Параметр: —</span>
                </div>
            </div>
        </div>

    </div>

    <!-- Панель GPS Координат (Lat/Lon) з обмеженням ширини -->
    <div class="card" style="margin: 10px 10px 10px auto; padding: 1px 1px; background: var(--bg-card, #141414); 
        border: 1px solid #222; border-radius: 12px; text-align: center; 
        box-shadow: inset 0 0 10px rgba(0,0,0,0.5); width: 90%; max-width: 220px; box-sizing: border-box;">
        <div class="area-block"
            style="display: flex; justify-content: flex-end; align-items: center; padding-right: 12px; box-sizing: border-box;">
            <span id="area">0.0000</span>
            <small style="margin-left: 10px; ">ha</small>
        </div>
        <div class="area-block"
            style="font-size: 0.7rem; display: flex; justify-content: flex-end; align-items: center; padding-right: 12px; box-sizing: border-box;">
            <span id="current_file">NONE</span>
            <!-- small style="margin-left: 10px; ">ha</small -->
        </div>

        <div
            style="display: none /*grid*/; grid-template-rows: 1fr 1fr; gap: 4px; font-family: monospace; font-weight: bold;">
            <div
                style="display: flex; justify-content: space-between; font-size: 0.9rem; border-bottom: 1px solid #222; padding-bottom: 4px;">
                <span id="gps-lat" style="color: var(--accent, #00ff7f); letter-spacing: 0.5px;">0.00000000</span>
            </div>
            <div style="display: flex; justify-content: space-between; font-size: 0.9rem; padding-top: 4px;">
                <span id="gps-lon" style="color: var(--accent, #00ff7f); letter-spacing: 0.5px;">0.00000000</span>
            </div>
        </div>
    </div>


    <!-- ПРАВО (Под компасом): Панель инструментов -->
    <div class="zoom-panel">
        <!-- button class="tool-btn" onclick="zoom *= 1.3">➕</button -->
        <button class="tool-btn" onclick="zoom *= 1.3"> <!-- Z + -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>
        <!-- button class="tool-btn" onclick="zoom *= 0.7">➖</button -->
        <button class="tool-btn" onclick="zoom /= 1.3"> <!-- Z - -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                stroke-linecap="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
            </svg>
        </button>

        <button id="mBtn" class="master-btn master-off" onclick="toggleMaster()" title="Головний вимикач">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
            </svg>
        </button>
    </div>

    <!-- ЛЕВО Панель инструментов -->
    <div class="left-panel">
        <!-- Кнопка перехода в Менеджер Дампов (Полей) -->
        <button class="tool-btn" onclick="location.href='/fields'" title="Менеджер сохраненных полей">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00ff7f" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 22c5.523 0 10-1.79 10-4V6c0-2.21-4.477-4-10-4S2 3.79 2 6v12c0 2.21 4.477 4 10 4z"></path>
                <path d="M22 6c0 2.21-4.477 4-10 4S2 8.21 2 6"></path>
                <path d="M22 12c0 2.21-4.477 4-10 4S2 14.21 2 12"></path>
            </svg>
        </button>

        <button class="tool-btn" onclick="resetAll()">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#e74c3c" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <polyline points="3 6 5 6 21 6"></polyline>
                <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
        </button>
        <button class="tool-btn" onclick="location.href='/settings'">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="3"></circle>
                <path
                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                </path>
            </svg>
        </button>

        <button class="tool-btn" onclick="location.href='/vra_control'" title="Керування картами VRA"
            style="margin-top: 8px;">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none">
                <!-- Крупная, отлично читаемая надпись VRA строго по центру -->
                <text x="12" y="16.5" font-family="sans-serif" font-size="10px" font-weight="900" fill="#2ecc71"
                    stroke="none" text-anchor="middle">VRA</text>
            </svg>
        </button>
    </div>

    <canvas id="bgCanvas"></canvas>
    <canvas id="fgCanvas"></canvas>

    <div id="connectionModal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-icon">⚠️</div>
            <h2>Связь потеряна</h2>
            <p>Нет ответа от контроллера трактора. Проверьте сеть.</p>
            <button onclick="hideModal()" class="modal-btn">ПОНЯТНО</button>
        </div>
    </div>
    <!-- Модальне вікно для головного екрана -->
    <div id="customModal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.85); z-index:10000; justify-content:center; align-items:center;">
        <div
            style="background:#1e1e1e; width:80%; max-width:500px; padding:35px; border-radius:20px; border-top:8px solid #c0392b; text-align:center; box-shadow: 0 10px 50px rgba(0,0,0,0.8);">
            <h3 id="modalText" style="margin: 0 0 35px 0; font-size: 26px; color: white; font-weight: bold;">Текст...
            </h3>
            <div style="display: flex; gap: 20px; justify-content:center;">
                <button type="button" id="modalCancelBtn" class="btn-step"
                    style="flex:1; height:90px; background:#444; color:white; border-radius:15px; font-size:22px; border:none; font-weight:bold;">ОТМЕНА</button>
                <button type="button" id="modalConfirmBtn" class="btn-step"
                    style="flex:1; height:90px; background:#c0392b; color:white; border-radius:15px; font-size:22px; border:none; font-weight:bold;">СБРОСИТЬ</button>
            </div>
        </div>
    </div>
    <!-- Подключаем внешние скрипты (Передаем во Flask глобальный конфиг) -->
    <script> const cfg = {{ cfg | tojson }}; </script>
    <script src="{{ url_for('static', filename='js/emulator.js') }}"></script>
    <script src="{{ url_for('static', filename='js/diagnostic.js') }}"></script>
    <script src="{{ url_for('static', filename='js/board.js') }}"></script>
</body>

</html>
