<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менеджер знарядь</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='css/settings.css') }}">
    <!-- Підключаємо офлайн-пак іконок через Flask-шаблонізатор -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/fonts.css') }}">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: sans-serif;
        }

        body {
            background: #121212;
            color: #fff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* ЛІВА КОЛОНКА */
        .sidebar {
            width: 35%;
            border-right: 1px solid #333;
            display: flex;
            flex-direction: column;
            background: #1a1a1a;
        }

        .sidebar-header {
            padding: 20px;
            border-bottom: 1px solid #333;
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        .impl-list {
            flex: 1;
            overflow-y: auto;
        }

        /* ВЕЛИКА КАРТКА ПІД ПАЛЕЦЬ (Fitt's Law) */
        .impl-item {
            display: flex;
            align-items: center;
            padding: 15px 20px;
            height: 75px;
            border-bottom: 1px solid #2a2a2a;
            cursor: pointer;
            transition: background 0.2s;
        }

        .impl-item:hover {
            background: #222;
        }

        .impl-item.active {
            background: #007bff;
        }

        .impl-info {
            flex: 1;
        }

        .impl-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .impl-meta {
            font-size: 12px;
            color: #aaa;
        }

        .impl-item.active .impl-meta {
            color: #ddd;
        }

        /* ПРАВА КОЛОНКА */
        .details-panel {
            flex: 1;
            padding: 30px;
            display: flex;
            flex-direction: column;
            background: #141414;
        }

        .details-header {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 25px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .edit-form {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ВЕЛИКІ ЕЛЕМЕНТИ ФОРМИ */
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .form-group label {
            font-size: 14px;
            color: #00ff88;
            font-weight: bold;
        }

        .input-big {
            width: 100%;
            height: 50px;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 0 15px;
            font-size: 18px;
            border-radius: 6px;
        }

        .select-big {
            width: 100%;
            height: 50px;
            background: #000;
            border: 1px solid #444;
            color: #fff;
            padding: 0 15px;
            font-size: 18px;
            border-radius: 6px;
        }

        /* ВЕЛИКІ СПІНЕРИ (ПЛЮС / МИНУС) */
        .spinner {
            display: flex;
            align-items: center;
        }

        .spinner button {
            width: 65px;
            height: 50px;
            background: #333;
            color: #fff;
            border: none;
            font-size: 24px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
        }

        .spinner button:active {
            background: #555;
        }

        .spinner input {
            width: 110px;
            height: 50px;
            text-align: center;
            font-size: 20px;
            background: #000;
            color: #fff;
            border: 1px solid #444;
            margin: 0 5px;
            border-radius: 6px;
        }

        /* НИЖНІ ПАНЕЛІ КНОПОК */
        .footer-bar {
            padding: 15px 20px;
            background: #1f1f1f;
            border-top: 1px solid #333;
            display: flex;
            gap: 10px;
        }

        .btn {
            flex: 1;
            height: 55px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            color: #fff;
        }

        .btn-add {
            background: #28a745;
        }

        .btn-activate {
            background: #007bff;
        }

        .btn-delete {
            background: #dc3545;
            max-width: 80px;
        }

        .btn-save {
            background: #218838;
        }

        .btn-cancel {
            background: #6c757d;
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .no-selection {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #666;
        }
    </style>
</head>

<body>

    <!-- ЛІВА ЧАСТИНА: Список під пальці -->
    <div class="sidebar">
        <div class="sidebar-header">
            <!-- Кнопка повернення на карту (вставити замість текстової кнопки Назад) -->
            <button class="tool-btn" onclick="location.href='/'" title="Повернутися на карту">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00ff7f" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                    <polyline points="9 22 9 12 15 12 15 22"></polyline>
                </svg>
            </button>

            🚜 Доступні знаряддя 123
        </div>
        <div class="impl-list" id="implements-list-container">
            <!-- JS закине сюди картки знарядь -->
        </div>
        <div class="footer-bar">
            <button class="btn btn-add" onclick="createNewImplement()">➕</button>
            <button class="btn btn-activate" id="btn-activate-work" onclick="activateImplement()" disabled>В
                роботу</button>
            <button class="btn btn-delete" id="btn-delete-work" onclick="deleteImplement()" disabled>🗑️</button>
        </div>
    </div>

    <!-- ПРАВА ЧАСТИНА: Картка та Ролбек -->
    <div class="details-panel" id="main-details-panel">
        <div class="no-selection" id="no-selection-msg">Виберіть або додайте знаряддя зліва для налаштування</div>

        <div id="editor-container" style="display: none; height: 100%; flex-direction: column;">
            <div class="details-header" id="details-panel-title">Редагування знаряддя</div>

            <div class="edit-form">
                <div class="form-group">
                    <label>Назва обладнання:</label>
                    <input type="text" id="impl-name-input" class="input-big"
                        oninput="updateCurrentCopy('name', this.value)">
                </div>

                <div class="form-group">
                    <label>Тип навішування:</label>
                    <select id="impl-type-select" class="select-big"
                        onchange="updateCurrentCopy('implement_type', this.value)">
                        <option value="MOUNTED">Навісне (Mounted)</option>
                        <option value="TRAILED">Причіпне (Trailed)</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Винос штанги назад (м):</label>
                    <div class="spinner">
                        <button onclick="adjustGeometryValue('offset_back', -0.1)">-</button>
                        <input type="number" id="impl-offset-back" readonly>
                        <button onclick="adjustGeometryValue('offset_back', 0.1)">+</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Кількість секцій штанги:</label>
                    <div class="spinner">
                        <button onclick="adjustSectionsCount(-1)">-</button>
                        <input type="number" id="impl-sections-count" readonly>
                        <button onclick="adjustSectionsCount(1)">+</button>
                    </div>
                </div>

                <div class="form-group">
                    <label>Ширина однієї секції (м):</label>
                    <div class="spinner">
                        <button onclick="adjustGeometryValue('single_section_width', -0.5)">-</button>
                        <input type="number" id="impl-section-width" readonly>
                        <button onclick="adjustGeometryValue('single_section_width', 0.5)">+</button>
                    </div>
                </div>
            </div>

            <div class="footer-bar" style="border-top: 1px solid #333; margin-top: 15px;">
                <button class="btn btn-cancel" id="btn-rollback" onclick="rollbackChanges()" disabled>❌
                    Скасувати</button>
                <button class="btn btn-save" id="btn-save-disk" onclick="saveChangesToDisk()" disabled>💾
                    Застосувати</button>
            </div>
        </div>
    </div>

    <!-- Тут буде наш JS скрипт глибокого клонування -->
    <script src="/static/js/implements_logic.js"></script>
</body>

</html>
